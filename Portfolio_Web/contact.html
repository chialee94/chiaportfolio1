  <body>
    <div class="page-container">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="nav-container">
          <!-- Logo with tooltip -->

      <!-- Page Header -->
      <h1>Contact Me</h1>

      <!-- Main Contact Section -->
      <main class="resume-container">
        <section class="resume">
          <!-- Left Column: Contact Form -->
          <div class="resume-summary">
            <p>
              <strong
                >Thank you for visiting my portfolio. I appreciate your time and
                interest.</strong
              >
            </p>

            <form id="contact-form">
              <!-- Name -->
              <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Your full name"
                  required
                />
              </div>

              <!-- Email -->
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="you@example.com"
                  required
                />
              </div>

              <!-- Message -->
              <div class="form-group">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="6"
                  placeholder="Type your message here..."
                  required
                ></textarea>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="contact-cta-btn">
                Send Message
              </button>
            </form>
          </div>

          <!-- Right Column: Contact Info -->
          <aside class="contact-aside">
            <h4>Contact Information</h4>

            <p><strong>Email</strong></p>
            <a href="mailto:chichia.lee94@gmail.com">chichia.lee94@gmail.com</a>

            <p><strong>Phone</strong></p>
            <a href="tel:7155513977">(715) 715-551-3977</a>

            <p><strong>LinkedIn</strong></p>
            <a href="#">www.linkedin.com/in/chichialee</a>
          </aside>
        </section>
      </main></br></br>
    </div>
